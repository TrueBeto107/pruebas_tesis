{% extends "base.html" %}
{% block contenido %}
  <main class="w-full h-full p-5 bg-[#EFEFFF]">
    <h1 class="titulo">Titulo</h1>
    <h2 class="subtitulo">Subtitulo</h2>
    <p class="txt-destacado">Párrafo destacado</p>
    <p class="txt">Párrafo normal</p>
    <button class="btn-primario transicion-resplandor transicion-presion mb-5"
            type="button">Botón primario</button>
    <button class="btn-secundario transicion-resplandor-secundario transicion-presion"
            type="button">Botón secundario</button>
    <button class="btn-icono transicion-flotar" type="button">
      <svg class="icono">
        <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
      </svg>
    </button>
    <table class="table-fixed">
      <thead class="cabecera-tabla">
        <tr>
          <th class="celda">Columna de texto</th>
          <th class="celda">Columna de botones</th>
        </tr>
      </thead>
      <tbody>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda transicion-presion mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda transicion-presion" type="button">Botón</button>
              <button class="btn-icono hover:animate-sway hover:-translate-y-0.5 transition duration-300 ease-in-out"
                      type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono transicion-flotar" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda transicion-presion mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda transicion-presion" type="button">Botón</button>
              <button class="btn-icono hover:animate-sway hover:-translate-y-0.5 transition duration-300 ease-in-out"
                      type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono transicion-flotar" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda transicion-presion mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda transicion-presion" type="button">Botón</button>
              <button class="btn-icono hover:animate-sway hover:-translate-y-0.5 transition duration-300 ease-in-out"
                      type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono transicion-flotar" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda transicion-presion mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda transicion-presion" type="button">Botón</button>
              <button class="btn-icono hover:animate-sway hover:-translate-y-0.5 transition duration-300 ease-in-out"
                      type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono transicion-flotar" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <form>
      <label class="block w-fit h-fit group">
        <p>Input combobox</p>
        <select class="in">
          <option disabled selected value="Default"></option>
          <option value="1">Opcion 1</option>
          <option value="2">Opcion 2</option>
          <option value="3">Opcion 3</option>
        </select>
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de texto</p>
        <input class="in" type="text" placeholder="Ingresa un texto">
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de fecha</p>
        <input class="in" type="date">
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de color</p>
        <div class="flex items-center justify-center group">
          <input class="in" type="text" placeholder="#FFFFFF">
          <input class="in-color" type="color" value="#FF0000">
        </div>
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de archivo</p>
        <input class="in" type="file">
      </label>
      <div class="flex flex-wrap gap-6 p-4 text-gray-700">
        <label class="label-checkbox">
          <input type="checkbox" name="opciones" value="1" class="checkbox">
          Opción 1
        </label>
        <label class="label-checkbox">
          <input type="checkbox" name="opciones" value="2" class="checkbox">
          Opción 2
        </label>
      </div>
      <div class="w-2xl bg-[#8E8E8E] rounded-full h-5">
        <div class="bg-[#52969E] h-5 rounded-full text-white text-xs flex items-center justify-center"
             style="width: 75%">75%</div>
      </div>
    </form>
  </main>
{% endblock %}
