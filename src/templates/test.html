{% extends "base.html" %}
{% block contenido %}
  <main class="w-full h-full p-5 bg-[#EFEFFF]">
    <h1 class="titulo">Titulo</h1>
    <h2 class="subtitulo">Subtitulo</h2>
    <p class="txt-destacado">Párrafo destacado</p>
    <p class="txt">Párrafo normal</p>
    <button class="btn-primario transicion-escala " type="button">Botón primario</button>
    <button class="btn-secundario transicion-centro" type="button">Botón secundario</button>
    <div class="flex flex-wrap gap-4 p-8 bg-gray-100">
      <button class="btn-primario transicion-resplandor">Resplandor</button>
      <button class="btn-secundario transicion-presion">Presión</button>
      <button class="btn-primario transicion-rebote">Rebote</button>
      <button class="btn-secundario transicion-brillo">Brillo</button>
      <button class="btn-primario transicion-oscurecer">Oscurecer</button>
      <button class="btn-secundario transicion-rotar">Rotar</button>
      <button class="btn-primario transicion-deslizar">Deslizar</button>
      <button class="btn-secundario transicion-hundir">Hundir</button>
      <button class="btn-primario transicion-flotar">Flotar</button>
      <button class="btn-secundario transicion-completa">Completa</button>
      <button class="btn-primario transicion-zoom">Zoom</button>
      <button class="btn-secundario transicion-encoger">Encoger</button>
      <button class="btn-primario transicion-anillo">Anillo</button>
      <button class="btn-secundario transicion-elegante">Elegante</button>
    </div>
    <button class="btn-icono" type="button">
      <svg class="icono">
        <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
      </svg>
    </button>
    <table class="table-fixed">
      <thead class="cabecera-tabla">
        <tr>
          <th class="celda">Columna de texto</th>
          <th class="celda">Columna de botones</th>
        </tr>
      </thead>
      <tbody>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda" type="button">Botón</button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda" type="button">Botón</button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda" type="button">Botón</button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr class="fila-tabla">
          <td class="celda">Celda</td>
          <td class="celda">
            <div class="div-centrado">
              <button class="btn-primario-celda mr-2.5" type="button">Botón</button>
              <button class="btn-primario-celda" type="button">Botón</button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#editar"></use>
                </svg>
              </button>
              <button class="btn-icono" type="button">
                <svg class="icono">
                  <use xlink:href="{{ url_for('static', filename='iconos.svg') }}#borrar"></use>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <form>
      <label class="block w-fit h-fit group">
        <p>Input de texto</p>
        <input class="in"
               type="text"
               placeholder="Ingresa un texto">
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de texto</p>
        <input class="in"
               type="date">
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de color</p>
        <div class="flex items-center justify-center group">
          <input class="in" type="text" placeholder="#FFFFFF">
          <input class="-ml-11 h-9 w-9 z-10 group-active:scale-95" type="color" value="#FF0000">
        </div>
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de archivo</p>
        <input class="in"
               type="file">
      </label>
      <label class="block w-fit h-fit group">
        <p>Input de checkbox</p>
        <input class="in"
               type="date">
      </label>
      <div class="flex flex-wrap gap-6 p-4 text-gray-700">
        <label class="label-checkbox">
          <input type="checkbox" name="opciones" value="1" class="checkbox">
          Opción 1
        </label>
        <label class="label-checkbox">
          <input type="checkbox" name="opciones" value="2" class="checkbox">
          Opción 2
        </label>
      </div>
      <div class="w-2xl bg-[#8E8E8E] rounded-full h-5">
        <div class="bg-[#52969E] h-5 rounded-full text-white text-xs flex items-center justify-center" style="width: 75%">
          75%
        </div>
      </div>
    </form>
  </main>
