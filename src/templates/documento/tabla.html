<div class="shadow-md flex justify-center">
    <table class="min-w-10/12 divide-y divide-gray-200 border border-[#828282]">
        <thead class="bg-[#66A5AD]">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                    Nombre del Documento
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                    Ruta del Archivo
                </th>
                <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-white uppercase tracking-wider">
                    Acción
                </th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for documento in documentos %}
            <tr class="group hover:bg-gray-100 transition duration-150 even:bg-[#d9eff1] even:hover:bg-[#d0e7e9]">
                <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-900">
                    {{ documento.id_documento_evento }}
                </td>
                <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">
                    {{ documento.ruta_archivo }}
                </td>
                <td class="relative px-6 py-3 whitespace-nowrap text-center">
                    <button hx-get="{{ url_for('documento.mostrar', ruta=documento.ruta_archivo) }}" 
                            hx-target="#div-pdf"
                            class="bg-[#52969E] hover:bg-[#3D7A82] text-white font-bold py-2 px-4 rounded-lg transition duration-200 text-sm">
                        Ver
                    </button>
                    <div class="absolute -right-15 top-0 hidden group-hover:flex px-0.5 py-4 whitespace-nowrap">
                        <button hx-get="{{ url_for('documento.mostrar', ruta=documento.ruta_archivo) }}" 
                            hx-target="#div-pdf"
                            class="bg-[#52969E] hover:bg-[#3D7A82] text-white font-bold py-2 px-4 rounded-lg transition duration-200 text-sm">
                        🗑️
                    </button>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
</div>
