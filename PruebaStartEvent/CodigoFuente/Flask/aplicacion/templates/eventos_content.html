<!-- Título centrado -->
<h1 class="text-3xl font-bold text-center text-gray-800 mt-6 mb-8">Eventos</h1>

<!-- Grid de tarjetas (responsive) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 px-4 max-w-6xl mx-auto">
    
    <!--  Tarjeta "Nuevo evento" (SIEMPRE la primera) -->
    <a href="#" class="bg-white rounded-lg shadow-md overflow-hidden flex items-center hover:shadow-lg transition duration-200 border-2 border-dashed border-[#66A5AD]">
        <div class="flex items-center justify-center w-24 h-24 bg-[#66A5AD] bg-opacity-10 flex-shrink-0 text-4xl text-[#66A5AD]">+</div>
        <div class="p-4">
            <p class="font-bold text-gray-800">Nuevo evento</p>
            <p class="text-sm text-gray-500">¡Empieza la gestión de un evento!</p>
        </div>
    </a>

    <!--  Bucle para mostrar eventos dinámicamente -->
    {% for evento in lista_eventos %}
        <a href="#" class="bg-white rounded-lg shadow-md overflow-hidden flex items-center hover:shadow-lg transition duration-200">
            <img src="{{ url_for('documentos', filename=evento.ruta_logotipo) }}" alt="LogoEdicion" class="w-24 h-24 object-cover flex-shrink-0">
            <div class="p-4">
                <span class="font-bold text-lg text-gray-800">{{ evento.edicion }}°</span>
                <p class="text-gray-600">{{ evento.nombre }}</p>
            </div>
        </a>
    {% endfor %}

    <!--  Si no hay eventos, mostrar un mensaje -->
    {% if lista_eventos|length == 0 %}
        <div class="col-span-full text-center py-12">
            <p class="text-gray-500 text-lg">No hay eventos disponibles</p>
            <p class="text-gray-400">¡Crea tu primer evento usando el botón "Nuevo evento"!</p>
        </div>
    {% endif %}

</div>

<!-- Imagen de fondo centrada -->
<div class="fixed inset-0 -z-10 flex items-center justify-center opacity-10 pointer-events-none w-full h-full">
    <img src="https://aspirantes-posgrado.uacm.edu.mx/public/img/chikauak.png" alt="Fondo"  class="object-cover w-200 h-200">
</div>
