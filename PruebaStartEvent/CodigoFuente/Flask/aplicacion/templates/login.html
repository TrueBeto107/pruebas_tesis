{% extends "base.html" %}

{% block contenido %}
<form hx-post="{{ url_for('iniciar_sesion') }}" hx-target="#div-notificacion" class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md space-y-4">
    <h2 class="text-2xl font-bold text-center text-gray-800">Iniciar sesión</h2>
    <label class="block text-gray-700 font-medium">Correo:
        <input name="correo" type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"/>
    </label>
    <br><br>
    <label class="block text-gray-700 font-medium">Contraseña:</label>
        <input name="password" type="password" required/>
    <button type="submit">Entrar</button>
    <br><br>
    <a href="#">¿Olvidaste tu contraseña?</a>
</form>
<div id="div-notificacion"></div>
{% endblock %}
