{% extends "base.html" %}

{% block contenido %}

<!-- ============================================ -->
<!-- CONTENEDOR PRINCIPAL                         -->
<!-- ============================================ -->
<div class="min-h-screen bg-[#C4DFE6] py-8">
    <div class="max-w-7xl mx-auto px-4">
        <!-- Cambié max-w-4xl a max-w-7xl para más espacio -->
    
        <!-- ========================================== -->
        <!-- TARJETA DE BIENVENIDA                      -->
        <!-- ========================================== -->
        <div class="bg-gradient-to-r from-[#66A5AD] to-[#52969E] rounded-2xl p-8 shadow-xl mb-8">
            <div class="flex items-center justify-center space-x-3">
                <!-- Icono de usuario -->
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h1 class="text-3xl font-bold text-white text-center">
                    ¡Bienvenido! <span class="text-white/90">{{ nombre }}</span>
                </h1>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- FORMULARIO 1: BUSCAR DOCUMENTO             -->
        <!-- ========================================== -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-100">
            <!-- Encabezado del formulario -->
            <div class="flex items-center mb-4">
                <div class="bg-[#C4DFE6] rounded-lg p-2 mr-3">
                    <svg class="w-6 h-6 text-[#52969E]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-gray-800">🔍 Buscar Documento</h2>
            </div>
            <!-- Formulario con HTMX -->
            <form hx-get="{{ url_for('documento.get_documento') }}" hx-target="#div-pdf" class="space-y-4">
                <!-- Campo: ID del Documento -->
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">
                        ID del Documento
                    </label>
                    <input 
                        type="text" 
                        name="id_documento" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#66A5AD] focus:border-transparent transition"
                        placeholder="Ej: DOC-001"
                    />
                </div>
                <!-- Botón: Buscar documento -->
                <div>
                    <input 
                        type="submit" 
                        value="Buscar documento"
                        class="w-full bg-[#52969E] hover:bg-[#3D7A82] text-white font-bold py-3 px-4 rounded-xl transition duration-200 cursor-pointer shadow-md hover:shadow-lg"
                    />
                </div>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- FORMULARIO 2: CREAR DOCUMENTO              -->
        <!-- ========================================== -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-100">
            <!-- Encabezado del formulario -->
            <div class="flex items-center mb-4">
                <div class="bg-[#C4DFE6] rounded-lg p-2 mr-3">
                    <svg class="w-6 h-6 text-[#52969E]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-gray-800">✏️ Crear Documento</h2>
            </div>
            
            <!-- Formulario con HTMX -->
            <form hx-post="{{ url_for('documento.crear_documento') }}" hx-target="#div-pdf" class="space-y-4">
                <!-- Campo: Texto del documento -->
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">
                        Ingresa un texto
                    </label>
                    <input 
                        type="text" 
                        name="form-texto" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#66A5AD] focus:border-transparent transition"
                        placeholder="Escribe el contenido del documento"
                    />
                </div>
                
                <!-- Botón: Crear documento -->
                <div>
                    <input 
                        type="submit" 
                        value="Crear documento"
                        class="w-full bg-[#52969E] hover:bg-[#3D7A82] text-white font-bold py-3 px-4 rounded-xl transition duration-200 cursor-pointer shadow-md hover:shadow-lg"
                    />
                </div>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- CONTENEDOR PARA RESULTADOS DEL PDF         -->
        <!-- ========================================== -->
        <div id="div-pdf" hx-swap-oob="true" class="bg-white rounded-2xl shadow-xl p-4 border-2 border-[#66A5AD]/30 mb-6 overflow-auto w-full">
            <div class="w-full" style="min-height: 500px;">
                <p class="text-gray-400 text-center py-4">📄 Los resultados del PDF aparecerán aquí</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- CONTENEDOR PARA LA TABLA DE DOCUMENTOS     -->
        <!-- ========================================== -->
        <div id="div-tabla" hx-swap-oob="true" class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4">📋 Lista de Documentos</h2>
            {% include "tabla.html" %}
        </div>

    </div>
</div>

{% endblock %}
